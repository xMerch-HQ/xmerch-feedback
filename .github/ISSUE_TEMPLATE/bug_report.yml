name: Bug report
description: Something on xMerch doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Found a security problem? Don't post it here: use [Report a vulnerability](https://github.com/xMerch-HQ/xmerch-feedback/security/advisories/new).
        Never post card details, wallet secrets or another person's information.
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Store or product page
        - Cart or card checkout
        - Wallet checkout (Xaman, XRP or Xahau)
        - Orders or downloads
        - Booking an appointment
        - Events or registration
        - Auctions
        - Team store or team order
        - Seller dashboard (admin.xmerch.app)
        - DEX (dex.xmerch.app)
        - xmerch CLI
        - Something else
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page link
      placeholder: https://yourstore.xmerch.app/product/...
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, one per line, so we can do the same.
      placeholder: |
        1. Opened the product page
        2. Picked a size and added it to the cart
        3. Paid by card
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Order number or transaction hash
      description: If it's about a payment or an order.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome / Xaman xApp
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Hide any personal details first.
